[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"
watchPatterns = [
  "/apps/worker/**",
  "/apps/web/package.json",
  "/packages/application/**",
  "/packages/blizzard/**",
  "/packages/contracts/**",
  "/packages/database/**",
  "/packages/domain/**",
  "/packages/raiderio/**",
  "/packages/warcraftlogs/**",
  "/.dockerignore",
  "/.npmrc",
  "/Dockerfile.worker",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/railway.worker.toml",
  "/tsconfig.base.json",
]

[deploy]
preDeployCommand = "/app/migrate/node_modules/.bin/tsx /app/migrate/src/cli-migrate.ts"
startCommand = "/app/worker/node_modules/.bin/tsx /app/worker/src/main.ts"
healthcheckPath = "/ready"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
overlapSeconds = 10
drainingSeconds = 35
