name: claude-code-review

# The review costs the same on every run regardless of diff size: the plugin
# fans out to a fixed fleet of agents, two of them Opus, plus one Opus
# subagent per candidate finding. Cost is therefore controlled by running it
# less often, not by making each run smaller.
on:
  pull_request:
    # Deliberately no `synchronize`: reviewing every push multiplied the cost
    # by the number of pushes, and an in-flight review killed by the next push
    # was billed in full for nothing.
    types: [opened, ready_for_review, reopened]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  # Never cancel a review that is already paying for itself.
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets are withheld from fork pull requests, so the review would fail rather than run.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # --model sets the orchestrating session only. The plugin names its
          # own subagent models in its prompt, so the Opus review and
          # validation agents are unaffected. --max-turns is a runaway
          # backstop, not a cost dial: setting it low buys a truncated review
          # at full price.
          #
          # --allowedTools repeats the plugin's own `allowed-tools` frontmatter
          # rather than naming only the MCP tool. Naming one tool appeared to
          # replace that list instead of adding to it, leaving the plugin
          # unable to run the `gh` commands it reads and posts with: a full
          # review ran, denied three tool calls, and posted nothing. This grants
          # nothing the plugin does not already declare.
          claude_args: >-
            --model claude-sonnet-5
            --max-turns 50
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),mcp__github_inline_comment__create_inline_comment"
