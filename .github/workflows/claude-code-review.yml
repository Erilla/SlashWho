name: claude-code-review

# Runs `.claude/skills/pr-review`, a single-pass reviewer, rather than the
# upstream code-review plugin. The plugin fanned out to four agents plus one
# Opus validator per candidate finding, which cost about $1 per pull request
# and scaled with the size of the diff and the number of suspicions raised.
# This reads the diff once, on Sonnet, and spends more only when it actually
# has a finding to check.
#
# The trade-off is precision: the plugin's extra agents existed to filter false
# positives. Findings here are advisory and gate nothing, so a noisier review
# is a cheaper mistake than a bill that scales with the diff.
on:
  pull_request:
    # Deliberately no `synchronize`: reviewing every push multiplied the cost
    # by the number of pushes, and an in-flight review killed by the next push
    # was billed in full for nothing.
    types: [opened, ready_for_review, reopened]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  # Never cancel a review that is already paying for itself.
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets are withheld from fork pull requests, so the review would fail rather than run.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # The skill is read from the checkout, so it has to be on disk before the
      # action runs. The action then restores `.claude` from the default branch,
      # since a pull request's own head is untrusted — so an edit to the skill
      # takes effect only once it is merged, exactly like the workflow itself.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/pr-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # --allowedTools must repeat what the skill declares in its own
          # frontmatter: naming a subset here replaces that list rather than
          # adding to it, which previously left the reviewer unable to run the
          # `gh` commands it reads and posts with — a full review ran, denied
          # three tool calls, and posted nothing.
          #
          # --max-turns is a runaway backstop, not a cost dial: setting it low
          # buys a truncated review at full price. A single-pass review needs
          # far fewer turns than the plugin's fan-out did.
          claude_args: >-
            --model claude-sonnet-5
            --max-turns 20
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Read,Grep,Glob"
