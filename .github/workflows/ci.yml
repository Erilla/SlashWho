name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, prod]

# `ci` is a required status check on main. A required check that never reports
# blocks merging forever, and GitHub cannot tell "skipped by a path filter"
# apart from "has not run yet" — so this workflow must always trigger and
# always report. Prose-only pull requests are made cheap by skipping the
# suite's jobs, not by skipping the workflow.
#
# The suite runs as parallel jobs, so the wall clock is set by the slowest one
# rather than by the sum of all of them. The heavier suites are split so that
# no single job holds much more than a minute and a half of work:
#
#   scope ──┬── checks        format, lint, typecheck
#           ├── unit          unit tests
#           ├── integration
#           ├── e2e (×2)      Playwright, one shard of the spec files each
#           └── docker (×2)   one image each
#   all of them ───> ci       the required check
#
# The repository is public, so standard runners cost nothing extra: another
# parallel job is worth adding whenever it shortens the slowest one.
#
# Only the final job is named `ci`, and it is the only one branch protection
# needs to know about. The others report under their own names and can be
# renamed or split freely; `ci` cannot be, without also changing the ruleset.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      run_full: ${{ steps.scope.outputs.run_full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Decides whether this change can affect the build. Anything unrecognised
      # runs the full suite: the failure mode of running too often is a slow
      # pull request, and of running too rarely is a broken main.
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request; running the full suite."
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename'); then
            # File classification only makes a prose-only pull request cheaper.
            # GitHub can intermittently fail this endpoint under load; treating
            # that as an unknown change and running the gate is safe, whereas
            # failing here leaves a healthy branch permanently red.
            echo "Could not list pull-request files; running the full suite."
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$files" ]; then
            echo "No files reported; running the full suite."
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_full=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              # This file defines the suite below, so a change to it must be
              # executed rather than taken on trust.
              .github/workflows/ci.yml) run_full=true ;;
              *.md | docs/* | LICENSE | .github/ISSUE_TEMPLATE/* | .github/workflows/*) ;;
              *) run_full=true ;;
            esac
            if [ "$run_full" = "true" ]; then break; fi
          done < <(printf '%s\n' "$files")

          if [ "$run_full" = "true" ]; then
            echo "Code changed; running the full suite."
          else
            echo "Only prose and non-CI workflow files changed; skipping the suite."
            echo "$files" | sed 's/^/  /'
          fi
          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"

  # Everything that needs only an installed workspace: no build, no browser,
  # no database. Typecheck does not depend on a build, so it belongs here, and
  # it is the only place the workspace is typechecked: e2e and docker build the
  # web app, but neither needs the other packages' `build` scripts, which are
  # `tsc --noEmit` and nothing more.
  checks:
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - run: corepack pnpm format:check
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck

  unit:
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      # The unit suite was first given a 6 GB heap and then, when that was
      # still not enough, split into one vitest process per workspace
      # (d4739580, 209f11c9). apps/web is the heavy half — two thirds of the
      # time, and all the React and jsdom files — so it keeps a process to
      # itself. The other workspaces are small, and each paid a second or two
      # of vitest start-up for about a second of tests, so they share one
      # process. If that process runs out of heap, split it again rather than
      # raising the limit: each of the two workers inherits this setting.
      - run: corepack pnpm exec vitest run --project unit apps/web
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: >-
          corepack pnpm exec vitest run --project unit
          apps/worker packages scripts tests/e2e/support
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  # Testcontainers starts its own PostgreSQL through the runner's Docker
  # daemon, so this job needs no service container.
  integration:
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - run: corepack pnpm test:integration

  # The only job that needs a browser, so the only one that installs one.
  #
  # There is no build step. Playwright's global setup builds the web app when
  # apps/web/.next is missing, which it always is on a fresh runner, and it
  # overlaps that build with the PostgreSQL and fixture start-up. It builds only
  # the web app: `pnpm build` would also run every other package's `build`,
  # which is a `tsc --noEmit` that checks already does.
  #
  # The suite runs on one worker against one database (see
  # playwright.config.ts), so it is split into shards instead. Each shard is a
  # separate runner with its own global setup, database and servers; every spec
  # seeds what it needs, so no file depends on another having run first.
  e2e:
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.62.1-chromium
      - run: corepack pnpm playwright install --with-deps chromium
      - run: >-
          corepack pnpm playwright test --shard=${{ matrix.shard }}/2
          tests/e2e/search.spec.ts tests/e2e/connected-character-dialog.spec.ts
          tests/e2e/dossier-navigation.spec.ts

  # The images are built only to prove they still build; nothing is pushed or
  # loaded. Each image builds on its own runner. The layer cache lives in the
  # Actions cache, one scope per image so the two do not overwrite each other,
  # and mode=max keeps the intermediate build stage that holds the dependency
  # install.
  docker:
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [web, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          tags: slashwho-${{ matrix.image }}:ci
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # The required check. It must report on every run, so it runs even when a
  # job it needs failed or was skipped: without `always()`, a failure upstream
  # would skip this job too, and GitHub treats a skipped required check as
  # passing. It then decides for itself:
  #
  # - scope must have succeeded, because every other result depends on it;
  # - each suite job must have succeeded, or have been skipped because scope
  #   judged the change prose-only. A skip for any other reason is a failure.
  #
  # A matrix job reports one result for all of its legs: success only when
  # every leg succeeded.
  #
  # A run superseded by a newer push is cancelled by the concurrency group, and
  # this job then fails that run's commit; the newer run reports for its own.
  ci:
    needs: [scope, checks, unit, integration, e2e, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - env:
          RUN_FULL: ${{ needs.scope.outputs.run_full }}
          SCOPE: ${{ needs.scope.result }}
          CHECKS: ${{ needs.checks.result }}
          UNIT: ${{ needs.unit.result }}
          INTEGRATION: ${{ needs.integration.result }}
          E2E: ${{ needs.e2e.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          if [ "$SCOPE" != "success" ]; then
            echo "scope: $SCOPE, so there is no telling what this change needs."
            exit 1
          fi

          failed=0
          for pair in "checks=$CHECKS" "unit=$UNIT" \
            "integration=$INTEGRATION" "e2e=$E2E" "docker=$DOCKER"; do
            job="${pair%%=*}"
            result="${pair#*=}"
            if [ "$result" = "success" ]; then
              echo "$job: success"
            elif [ "$result" = "skipped" ] && [ "$RUN_FULL" = "false" ]; then
              echo "$job: skipped, as the change is prose-only"
            else
              echo "$job: $result"
              failed=1
            fi
          done
          exit "$failed"
