name: ci

on:
  pull_request:
  push:
    branches: [main, prod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.62.1-chromium
      - run: corepack pnpm playwright install --with-deps chromium
      - run: corepack pnpm format:check
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - run: corepack pnpm test:unit
      - run: corepack pnpm test:integration
      - run: corepack pnpm build
      - run: corepack pnpm playwright test tests/e2e/search.spec.ts
      - run: docker build -f Dockerfile.web -t slashwho-web:ci .
      - run: docker build -f Dockerfile.worker -t slashwho-worker:ci .
