name: live-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: slashwho-live-smoke
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - run: corepack pnpm tsx scripts/live-smoke.mts
        env:
          SLASHWHO_BASE_URL: ${{ vars.SLASHWHO_PRODUCTION_URL }}
          SLASHWHO_WORKER_URL: ${{ vars.SLASHWHO_PRODUCTION_WORKER_URL }}
          SLASHWHO_WORKER_MAX_SUCCESSFUL_RUN_AGE_MS: 172800000
          SLASHWHO_SMOKE_CHARACTER_URL: ${{ vars.SLASHWHO_SMOKE_CHARACTER_URL }}
          SLASHWHO_BOT_API_KEY: ${{ secrets.SLASHWHO_BOT_API_KEY }}
