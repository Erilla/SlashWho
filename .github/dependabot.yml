version: 2
updates:
  # Every action is pinned to a commit SHA with its version in a comment.
  # Dependabot moves the SHA and the comment together, which is what keeps the
  # pins from quietly going stale. The composite action is listed separately
  # because Dependabot reads only .github/workflows under "/".
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/setup-workspace"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
